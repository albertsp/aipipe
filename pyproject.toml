[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipipe"
version = "0.6.0"
description = "Pipeline Linear -> OpenCode (Go) con router de modelos, agentes por rol y control de presupuesto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
tui = ["prompt-toolkit>=3.0.46"]

[project.scripts]
aipipe = "aipipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aipipe = ["templates/*", "templates/agents/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests deben importar el codigo de ESTE arbol (p. ej. el worktree de un ticket), no una copia instalada con pip.
pythonpath = ["src"]
